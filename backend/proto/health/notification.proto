syntax = "proto3";

package health.notification;

option go_package = "github.com/healthos/proto/health/notification";

import "google/protobuf/timestamp.proto";

service NotificationService {
  rpc SendNotification(SendNotificationRequest) returns (NotificationResponse);
  rpc SendBulkNotification(BulkNotificationRequest) returns (BulkNotificationResponse);
  rpc GetNotifications(GetNotificationsRequest) returns (GetNotificationsResponse);
  rpc MarkAsRead(MarkAsReadRequest) returns (NotificationResponse);
  rpc GetUnreadCount(GetUnreadCountRequest) returns (UnreadCountResponse);
  rpc ScheduleReminder(ScheduleReminderRequest) returns (NotificationResponse);
}

message Notification {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string body = 4;
  string type = 5;
  string channel = 6;
  bool read = 7;
  string metadata = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp read_at = 10;
  string priority = 11;
  string action_url = 12;
}

message SendNotificationRequest {
  string user_id = 1;
  string title = 2;
  string body = 3;
  string type = 4;
  repeated string channels = 5;
  string metadata = 6;
  string priority = 7;
  string action_url = 8;
}

message BulkNotificationRequest {
  repeated string user_ids = 1;
  string title = 2;
  string body = 3;
  string type = 4;
  repeated string channels = 5;
  string priority = 6;
}

message GetNotificationsRequest {
  string user_id = 1;
  bool unread_only = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message MarkAsReadRequest {
  string notification_id = 1;
  string user_id = 2;
}

message GetUnreadCountRequest {
  string user_id = 1;
}

message ScheduleReminderRequest {
  string user_id = 1;
  string title = 2;
  string body = 3;
  google.protobuf.Timestamp scheduled_at = 4;
  string type = 5;
  string reference_id = 6;
}

message NotificationResponse {
  Notification notification = 1;
  string message = 2;
  bool success = 3;
}

message BulkNotificationResponse {
  int32 sent_count = 1;
  int32 failed_count = 2;
  string message = 3;
}

message GetNotificationsResponse {
  repeated Notification notifications = 1;
  int32 total = 2;
  int32 unread_count = 3;
}

message UnreadCountResponse {
  int32 count = 1;
  string user_id = 2;
}
