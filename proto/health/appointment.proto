syntax = "proto3";

package health.appointment;

option go_package = "github.com/healthos/proto/health/appointment";

import "google/protobuf/timestamp.proto";

service AppointmentService {
  rpc CreateAppointment(CreateAppointmentRequest) returns (AppointmentResponse);
  rpc GetAppointment(GetAppointmentRequest) returns (AppointmentResponse);
  rpc UpdateAppointment(UpdateAppointmentRequest) returns (AppointmentResponse);
  rpc CancelAppointment(CancelAppointmentRequest) returns (AppointmentResponse);
  rpc ListAppointments(ListAppointmentsRequest) returns (ListAppointmentsResponse);
  rpc GetDoctorSchedule(GetDoctorScheduleRequest) returns (ScheduleResponse);
  rpc GetAvailableSlots(GetAvailableSlotsRequest) returns (AvailableSlotsResponse);
  rpc CheckInPatient(CheckInRequest) returns (AppointmentResponse);
}

message Appointment {
  string id = 1;
  string patient_id = 2;
  string doctor_id = 3;
  string doctor_name = 4;
  string department = 5;
  google.protobuf.Timestamp scheduled_at = 6;
  int32 duration_minutes = 7;
  string status = 8;
  string appointment_type = 9;
  string notes = 10;
  string room = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  bool is_telemedicine = 14;
  string meeting_url = 15;
  int32 wait_time_minutes = 16;
}

message TimeSlot {
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;
  bool available = 3;
  string doctor_id = 4;
}

message CreateAppointmentRequest {
  string patient_id = 1;
  string doctor_id = 2;
  google.protobuf.Timestamp scheduled_at = 3;
  int32 duration_minutes = 4;
  string appointment_type = 5;
  string notes = 6;
  bool is_telemedicine = 7;
}

message GetAppointmentRequest {
  string id = 1;
}

message UpdateAppointmentRequest {
  string id = 1;
  google.protobuf.Timestamp scheduled_at = 2;
  string notes = 3;
  string status = 4;
  string room = 5;
}

message CancelAppointmentRequest {
  string id = 1;
  string reason = 2;
}

message CheckInRequest {
  string id = 1;
  string patient_id = 2;
}

message ListAppointmentsRequest {
  string patient_id = 1;
  string doctor_id = 2;
  string status = 3;
  string date_from = 4;
  string date_to = 5;
  int32 page = 6;
  int32 page_size = 7;
}

message GetDoctorScheduleRequest {
  string doctor_id = 1;
  string date = 2;
}

message GetAvailableSlotsRequest {
  string doctor_id = 1;
  string date = 2;
  int32 duration_minutes = 3;
}

message AppointmentResponse {
  Appointment appointment = 1;
  string message = 2;
}

message ListAppointmentsResponse {
  repeated Appointment appointments = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ScheduleResponse {
  string doctor_id = 1;
  string date = 2;
  repeated Appointment appointments = 3;
}

message AvailableSlotsResponse {
  string doctor_id = 1;
  string date = 2;
  repeated TimeSlot slots = 3;
}
